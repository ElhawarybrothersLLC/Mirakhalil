# Base44 dev-server config for this static site, mounted as
# /etc/nginx/nginx.conf.
#
# Workers run as root on purpose: the sandbox clones the repo into a
# mode-0700, root-owned directory, so the image's default `nginx` worker user
# cannot traverse the bind-mounted source and every request would 403.
user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Never serve dotfiles/metadata (e.g. .git) exposed by the repo bind mount.
        location ~ /\.(?!well-known) {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
